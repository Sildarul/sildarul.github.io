<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sildarul — Patchs & Projets</title>
  <meta name="description" content="Page de liens de Sildarul : patchs, projets, traductions françaises, doublages, textures et correctifs.">
  <style>
    :root {
      --text: #f7f1e7;
      --muted: #bdb4a7;
      --red: #b91522;
      --red2: #f03b45;
      --green: #44d760;
      --green2: #179438;
      --gold: #f2c84f;
      --blue: #51b7ff;
      --line: rgba(255,255,255,.14);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(185,21,34,.27), transparent 31rem),
        radial-gradient(circle at 90% 5%, rgba(40,90,160,.15), transparent 34rem),
        linear-gradient(145deg, #030408 0%, #080b12 48%, #05070b 100%);
      overflow-x: hidden;
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px),
        radial-gradient(circle at center, transparent 48%, rgba(0,0,0,.58) 100%);
      background-size: 46px 46px, 46px 46px, auto;
      opacity: .52;
    }

    a { color: inherit; }
    img { display: block; max-width: 100%; }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1480px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 44px;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
      padding: 16px 10px 8px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(44px, 7vw, 86px);
      line-height: .92;
      letter-spacing: -.055em;
      text-transform: uppercase;
      font-weight: 950;
      text-shadow: 0 8px 30px #000;
    }

    .hero h1 .red { color: var(--red2); }

    .hero p {
      margin: 14px auto 0;
      max-width: 1030px;
      color: var(--muted);
      font-size: clamp(15px, 2vw, 22px);
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .045em;
      line-height: 1.35;
    }

    .socials {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px auto 0;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.16);
      text-decoration: none;
      font-weight: 950;
      background: linear-gradient(145deg, rgba(32,37,50,.95), rgba(9,12,19,.95));
      box-shadow: 0 12px 28px rgba(0,0,0,.32);
      transition: transform .16s ease, filter .16s ease;
    }

    .social-btn:hover { transform: translateY(-2px); filter: brightness(1.09); }
    .social-btn.youtube { border-color: rgba(240,59,69,.45); }
    .social-btn.twitch { border-color: rgba(145,88,255,.55); }
    .social-btn.kofi { border-color: rgba(255,130,38,.45); }

    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
      margin-top: 18px;
    }

    .column {
      display: grid;
      gap: 13px;
    }

    .project-row {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 154px;
      gap: 10px;
      min-height: 116px;
      padding: 8px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(145deg, rgba(22,26,38,.94), rgba(7,9,15,.96));
      box-shadow: 0 16px 36px rgba(0,0,0,.28);
    }

    .project-row.placeholder { border-color: rgba(242,200,79,.24); }
    .project-row.work { border-color: rgba(81,183,255,.22); }
    .project-row.available { border-color: rgba(68,215,96,.18); }

    .banner {
      position: relative;
      overflow: hidden;
      height: 100px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.11);
      background: linear-gradient(160deg, rgba(22,26,40,.96), rgba(6,8,13,.98));
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.45);
      isolation: isolate;
    }

    .banner .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: blur(14px) brightness(.55);
      transform: scale(1.18);
      opacity: .95;
      z-index: 0;
    }

    .banner:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(5,7,11,.42), rgba(5,7,11,.08) 32%, rgba(5,7,11,.08) 68%, rgba(5,7,11,.42));
      z-index: 1;
      pointer-events: none;
    }

    .banner .fg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      padding: 8px 20px;
      z-index: 2;
      transition: transform .25s ease, filter .25s ease;
    }

    .project-row:hover .banner .fg { transform: scale(1.016); filter: brightness(1.04) contrast(1.04); }

    .banner.banner-wide .fg {
      object-fit: fill;
      padding: 6px 0;
    }

    .banner.banner-wide .bg {
      filter: blur(16px) brightness(.62);
      transform: scale(1.22);
    }


    .state {
      position: absolute;
      top: 7px;
      right: 8px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 1;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: .045em;
      color: #fff;
      background: rgba(0,0,0,.74);
      border: 1px solid rgba(255,255,255,.18);
      text-shadow: 0 2px 8px #000;
      box-shadow: 0 6px 15px rgba(0,0,0,.34);
    }


    .project-row > .state {
      top: 16px;
      right: calc(154px + 24px);
      z-index: 100;
      pointer-events: none;
    }

    .state.available { color: #061108; background: linear-gradient(135deg, var(--green2), var(--green)); }
    .state.work { color: #03111d; background: linear-gradient(135deg, #59baff, var(--blue)); }
    .state.soon { color: #180e00; background: linear-gradient(135deg, #bd8e16, var(--gold)); }

    .unlock-btn {
      border: 0;
      min-height: 100px;
      border-radius: 13px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, var(--red), var(--red2));
      font-weight: 950;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 12px 24px rgba(189,21,37,.28);
      transition: transform .16s ease, filter .16s ease, background .16s ease;
      font-size: 13px;
      line-height: 1.12;
    }

    .unlock-btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .unlock-btn:disabled { cursor: wait; opacity: .9; transform: none; }

    .unlock-btn.ready {
      color: #041008;
      background: linear-gradient(135deg, var(--green2), var(--green));
      box-shadow: 0 12px 24px rgba(68,215,96,.23);
      cursor: pointer;
    }

    .unlock-btn.soon-ready {
      color: #1c1300;
      background: linear-gradient(135deg, #bd8e16, var(--gold));
      box-shadow: 0 12px 24px rgba(242,200,79,.20);
    }

    footer {
      margin-top: 24px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 18px;
      background: rgba(8,10,15,.72);
      color: var(--muted);
      padding: 16px;
      text-align: center;
      line-height: 1.45;
      font-weight: 800;
    }

    footer b { color: var(--text); }

    @media (max-width: 1120px) {
      .board { grid-template-columns: 1fr; }
    }

    @media (max-width: 680px) {
      .wrap { width: min(100% - 18px, 1480px); padding-top: 14px; }
      .project-row { grid-template-columns: 1fr; min-height: auto; }
      .banner { height: 92px; }
      .unlock-btn { min-height: 52px; }
      .state { font-size: 10px; }
      .project-row > .state { top: 14px; right: 14px; }
    }
  </style>
</head>
<body>

      <p>Patchs, traductions, doublages, textures et correctifs</p>

          <button class="unlock-btn" type="button" data-youtube="https://www.youtube.com/@laboiteavider" data-download="https://drive.google.com/file/d/1ngqfOuKsUAwxgQLAz_AA1oaISSJZbby9/view?usp=drive_link">Activer</button>

          <button class="unlock-btn" type="button" data-youtube="https://www.youtube.com/@laboiteavider" data-download="https://drive.google.com/file/d/1vpGscA6F780YEbTK5u1SInaoP2TuNy0x/view?usp=drive_link">Activer</button>

    <footer>
      <b>Sildarul / La Boîte à Vider</b>
    </footer>
  </main>

  <script>
    const buttons = document.querySelectorAll('.unlock-btn');

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const youtubeUrl = button.dataset.youtube;
        const downloadUrl = button.dataset.download;
        const soon = button.dataset.soon === 'true';

        if (button.dataset.ready === 'true') {
          if (soon || !downloadUrl) {
            button.textContent = 'À venir';
            button.classList.add('soon-ready');
            return;
          }
          window.open(downloadUrl, '_blank', 'noopener');
          return;
        }

        window.open(youtubeUrl, '_blank', 'noopener');

        let seconds = 5;
        button.disabled = true;
        button.textContent = 'Attente ' + seconds + 's';

        const timer = setInterval(() => {
          seconds -= 1;
          if (seconds > 0) {
            button.textContent = 'Attente ' + seconds + 's';
          } else {
            clearInterval(timer);
            button.disabled = false;
            button.dataset.ready = 'true';
            button.classList.add(soon || !downloadUrl ? 'soon-ready' : 'ready');
            button.textContent = soon || !downloadUrl ? 'À venir' : 'Télécharger';
          }
        }, 1000);
      });
    });
  </script>
</body>
</html>
